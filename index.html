<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>VMS • IKTBN Chembong</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config/supabase.js"></script>
  <script src="/js/auth/auth.js"></script>
  <script src="/js/auth/session.js"></script>
  <script src="/js/auth/role-guard.js"></script>
  <script src="/js/modules/dashboard-router.js"></script>
</head>

<body class="vms-route-page">
  <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#eef3f8;font-family:Inter,system-ui,sans-serif;">
    <section style="width:min(520px,100%);background:#fff;border:1px solid #e1e7ef;border-radius:22px;padding:32px;text-align:center;box-shadow:0 18px 48px rgba(15,27,51,.10);">
      <div style="width:52px;height:52px;margin:0 auto 16px;border-radius:16px;display:grid;place-items:center;background:#0f1b33;color:#fff;font-size:24px;">🚘</div>
      <div style="font-size:11px;letter-spacing:.18em;font-weight:900;color:#728099;">VMS • IKTBN CHEMBONG</div>
      <h1 id="routeTitle" style="margin:10px 0 6px;color:#16223a;font-size:28px;">Menyiapkan sesi…</h1>
      <p id="routeMessage" style="margin:0;color:#728099;line-height:1.6;">Sila tunggu sebentar.</p>
      <div id="routeSpinner" aria-label="Loading" style="width:26px;height:26px;margin:20px auto 0;border:3px solid #dce4ed;border-top-color:#18a66b;border-radius:50%;animation:vmsSpin .8s linear infinite;"></div>
    </section>
  </main>

  <style>
    @keyframes vmsSpin { to { transform: rotate(360deg); } }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.VMSRoleHome?.route({
        titleElement: document.getElementById('routeTitle'),
        messageElement: document.getElementById('routeMessage')
      });
    });
  </script>
</body>
</html>
