<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | VMS IKTBN Chembong</title>
  <meta name="description" content="VMS - Sistem Pengurusan Kenderaan Jabatan IKTBN Chembong" />
  <style>
    :root{
      --navy:#0f1b33;
      --navy-2:#162642;
      --ink:#13213a;
      --muted:#71809a;
      --line:#dfe6ef;
      --panel:#ffffff;
      --bg:#eef3f8;
      --accent:#18a66b;
      --accent-2:#0c8755;
      --danger:#c53b3b;
      --shadow:0 24px 60px rgba(15,27,51,.14);
      --radius:24px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      background:
        radial-gradient(circle at 10% 10%, rgba(24,166,107,.10), transparent 28%),
        radial-gradient(circle at 90% 90%, rgba(15,27,51,.10), transparent 28%),
        linear-gradient(135deg,#f7f9fc 0%,var(--bg) 100%);
      color:var(--ink);
      padding:24px;
    }

    .shell{
      width:min(1080px,100%);
      display:grid;
      grid-template-columns:1.05fr .95fr;
      background:var(--panel);
      border:1px solid rgba(255,255,255,.8);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .brand-panel{
      position:relative;
      padding:56px;
      color:#fff;
      background:
        linear-gradient(145deg,rgba(15,27,51,.97),rgba(22,38,66,.96)),
        radial-gradient(circle at 20% 20%,rgba(24,166,107,.28),transparent 35%);
      min-height:640px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .brand-panel::after{
      content:"";
      position:absolute;
      width:300px;height:300px;
      right:-130px;bottom:-130px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:50%;
      box-shadow:0 0 0 42px rgba(255,255,255,.025),0 0 0 84px rgba(255,255,255,.02);
    }

    .brand-top,.brand-copy,.brand-footer{position:relative;z-index:1}
    .brand-mark{
      width:64px;height:64px;border-radius:18px;
      display:grid;place-items:center;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);
      font-size:30px;
      margin-bottom:22px;
    }

    .eyebrow{
      font-size:12px;
      font-weight:800;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:#9fb2cc;
      margin:0 0 14px;
    }

    h1{
      margin:0;
      font-size:clamp(34px,4vw,52px);
      line-height:1.04;
      letter-spacing:-.03em;
    }

    .lead{
      margin:20px 0 0;
      max-width:460px;
      color:#c3cede;
      font-size:16px;
      line-height:1.7;
    }

    .brand-footer{
      color:#9fb2cc;
      font-size:13px;
      line-height:1.6;
    }

    .login-panel{
      padding:56px;
      display:flex;
      align-items:center;
    }

    .login-card{width:100%;max-width:430px;margin:auto}
    .login-title{
      font-size:30px;
      line-height:1.1;
      letter-spacing:-.02em;
      margin:0;
      color:var(--ink);
    }

    .login-sub{
      margin:10px 0 30px;
      color:var(--muted);
      line-height:1.6;
    }

    .field{margin-bottom:18px}
    .field label{
      display:block;
      font-size:13px;
      font-weight:800;
      margin-bottom:8px;
      color:#34435d;
    }

    .input-wrap{position:relative}
    input{
      width:100%;
      height:52px;
      padding:0 16px;
      border:1px solid var(--line);
      border-radius:14px;
      outline:none;
      font:inherit;
      color:var(--ink);
      background:#fbfcfe;
      transition:.2s ease;
    }

    input:focus{
      border-color:#8bcfb0;
      background:#fff;
      box-shadow:0 0 0 4px rgba(24,166,107,.10);
    }

    .toggle-password{
      position:absolute;
      top:50%;right:10px;
      transform:translateY(-50%);
      height:34px;width:40px;
      border:0;background:transparent;
      color:#738198;cursor:pointer;
      border-radius:10px;
    }

    .toggle-password:hover{background:#eef3f8}
    .submit-btn{
      width:100%;
      height:54px;
      border:0;
      border-radius:14px;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      color:#fff;
      font:inherit;
      font-weight:800;
      letter-spacing:.01em;
      cursor:pointer;
      box-shadow:0 12px 26px rgba(24,166,107,.22);
      transition:.2s ease;
    }

    .submit-btn:hover{transform:translateY(-1px)}
    .submit-btn:disabled{opacity:.7;cursor:wait;transform:none}

    .message{
      display:none;
      margin:0 0 18px;
      padding:12px 14px;
      border-radius:12px;
      font-size:14px;
      line-height:1.5;
    }
    .message.show{display:block}
    .message.error{background:#fff0f0;color:var(--danger);border:1px solid #f3d4d4}
    .message.info{background:#eef6ff;color:#23598f;border:1px solid #d8e8fa}
    .message.success{background:#edf9f3;color:#136d48;border:1px solid #cfeedd}

    .security-note{
      margin-top:20px;
      color:#8a96a8;
      font-size:12px;
      line-height:1.5;
      text-align:center;
    }

    @media (max-width: 820px){
      .shell{grid-template-columns:1fr}
      .brand-panel{min-height:280px;padding:34px}
      .brand-footer{margin-top:32px}
      .login-panel{padding:34px}
      .lead{max-width:none}
    }

    @media (max-width: 520px){
      body{padding:0}
      .shell{border-radius:0;min-height:100vh;border:0}
      .brand-panel{padding:28px;min-height:250px}
      .login-panel{padding:28px 22px}
      h1{font-size:38px}
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="brand-panel" aria-label="VMS">
      <div class="brand-top">
        <div class="brand-mark" aria-hidden="true">🚘</div>
        <p class="eyebrow">IKTBN Chembong</p>
        <h1>VMS</h1>
        <p class="lead">Sistem Pengurusan Kenderaan Jabatan</p>
      </div>

      <div class="brand-footer">
        Akses sistem adalah berdasarkan akaun dan peranan pengguna yang ditetapkan.
      </div>
    </section>

    <section class="login-panel">
      <div class="login-card">
        <p class="eyebrow" style="color:#7a8aa5">SECURE ACCESS</p>
        <h2 class="login-title">Sign in to VMS</h2>
        <p class="login-sub">Log masuk untuk meneruskan ke sistem pengurusan kenderaan.</p>

        <div id="message" class="message" role="alert"></div>

        <form id="loginForm" autocomplete="on">
          <div class="field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              placeholder="nama@domain.com"
              required
            />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Masukkan password"
                required
              />
              <button class="toggle-password" type="button" id="togglePassword" aria-label="Show password">👁</button>
            </div>
          </div>

          <button id="loginBtn" class="submit-btn" type="submit">SIGN IN</button>
        </form>

        <div class="security-note">
          VMS • IKTBN Chembong
        </div>
      </div>
    </section>
  </main>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Existing VMS auth foundation -->
  <script src="/js/config/supabase.js"></script>
  <script src="/js/auth/auth.js"></script>
  <script src="/js/auth/session.js"></script>
  <script src="/js/auth/role-guard.js"></script>

  <script>
    (() => {
      'use strict';

      const form = document.getElementById('loginForm');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const loginBtn = document.getElementById('loginBtn');
      const message = document.getElementById('message');
      const togglePassword = document.getElementById('togglePassword');

      const showMessage = (text, type = 'error') => {
        message.textContent = text;
        message.className = `message show ${type}`;
      };

      const setLoading = (loading) => {
        loginBtn.disabled = loading;
        loginBtn.textContent = loading ? 'SIGNING IN…' : 'SIGN IN';
      };

      const getClient = () => {
        if (window.supabaseClient && window.supabaseClient.auth) return window.supabaseClient;
        if (window.supabase && typeof window.supabase.createClient !== 'function' && window.supabase.auth) return window.supabase;
        return null;
      };

      togglePassword.addEventListener('click', () => {
        const showing = passwordInput.type === 'text';
        passwordInput.type = showing ? 'password' : 'text';
        togglePassword.textContent = showing ? '👁' : '🙈';
        togglePassword.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        showMessage('', 'info');
        message.classList.remove('show');
        setLoading(true);

        try {
          const client = getClient();

          if (!client) {
            throw new Error(
              'Supabase client tidak dijumpai. Semak /js/config/supabase.js dan pastikan ia dimuatkan sebelum login script.'
            );
          }

          const email = emailInput.value.trim();
          const password = passwordInput.value;

          const { data, error } = await client.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          if (!data?.user) {
            throw new Error('Login berjaya tetapi maklumat pengguna tidak diterima.');
          }

          showMessage('Login berjaya. Membuka VMS…', 'success');

          // Give the auth state listener a moment to persist the session.
          setTimeout(() => {
            window.location.href = '/index.html';
          }, 400);

        } catch (error) {
          console.error('VMS login error:', error);
          showMessage(error?.message || 'Login gagal. Sila semak email dan password.', 'error');
        } finally {
          setLoading(false);
        }
      });
    })();
  </script>
</body>
</html>
