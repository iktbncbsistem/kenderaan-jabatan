<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Denied | VMS IKTBN Chembong</title>
  <style>
    :root{--navy:#0f1b33;--muted:#70809a;--bg:#f1f5f9;--danger:#c53b3b}
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
      background:linear-gradient(135deg,#f8fafc,var(--bg));color:var(--navy);
      padding:24px;
    }
    .card{
      width:min(520px,100%);background:#fff;border:1px solid #e1e7ef;
      border-radius:24px;padding:42px;text-align:center;
      box-shadow:0 24px 60px rgba(15,27,51,.12)
    }
    .icon{
      width:76px;height:76px;border-radius:22px;margin:0 auto 22px;
      display:grid;place-items:center;background:#fff0f0;color:var(--danger);font-size:34px
    }
    h1{margin:0 0 10px;font-size:34px;letter-spacing:-.03em}
    p{margin:0 auto 26px;max-width:410px;color:var(--muted);line-height:1.65}
    a{
      display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 20px;
      border-radius:12px;background:var(--navy);color:#fff;text-decoration:none;font-weight:800
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">403</div>
    <h1>Access Not Permitted</h1>
    <p>Akaun anda tidak mempunyai kebenaran untuk mengakses halaman ini.</p>
    <a href="/index.html">Kembali ke VMS</a>
  </main>
</body>
</html>
