<!DOCTYPE html>
<html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>VMS | Password Baharu</title>
<style>:root{--navy:#0f1b33;--ink:#13213a;--muted:#71809a;--line:#dfe6ef;--green:#18a66b;--danger:#c53b3b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#f8fafc,#eef3f8);color:var(--ink)}.card{width:min(460px,100%);background:#fff;border:1px solid #e7edf4;border-radius:24px;padding:38px;box-shadow:0 24px 65px rgba(15,27,51,.13)}.mark{width:58px;height:58px;border-radius:17px;background:var(--navy);display:grid;place-items:center;color:#fff;font-size:25px;margin-bottom:22px}.ey{font-size:11px;font-weight:900;letter-spacing:.18em;color:#7a8aa5}.title{font-size:29px;margin:8px 0}.sub{color:var(--muted);line-height:1.55}.field{margin:17px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}input{width:100%;height:52px;border:1px solid var(--line);border-radius:13px;padding:0 14px;font:inherit;outline:0}input:focus{border-color:#8bcfb0;box-shadow:0 0 0 4px rgba(24,166,107,.1)}button{width:100%;height:53px;border:0;border-radius:13px;background:linear-gradient(135deg,#18a66b,#0c8755);color:#fff;font:inherit;font-weight:850;cursor:pointer}.msg{display:none;margin:15px 0;padding:12px 14px;border-radius:12px;font-size:13px}.msg.show{display:block}.msg.error{background:#fff0f0;color:var(--danger)}.msg.success{background:#edf9f3;color:#136d48}</style></head>
<body><main class="card"><div class="mark">🚘</div><div class="ey">VMS • IKTBN CHEMBONG</div><h1 class="title">Tetapkan password baharu</h1><p class="sub">Masukkan password baharu untuk akaun VMS anda.</p><div id="msg" class="msg"></div><form id="form"><div class="field"><label for="p1">Password baharu</label><input id="p1" type="password" autocomplete="new-password" minlength="8" required placeholder="Minimum 8 aksara"></div><div class="field"><label for="p2">Sahkan password</label><input id="p2" type="password" autocomplete="new-password" minlength="8" required placeholder="Ulang password"></div><button id="btn">SIMPAN PASSWORD</button></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/config/supabase.js"></script><script src="/js/auth/auth.js"></script><script>
(()=>{const f=document.getElementById('form'),m=document.getElementById('msg'),b=document.getElementById('btn');const msg=(t,c='error')=>{m.textContent=t;m.className=`msg show ${c}`};f.addEventListener('submit',async e=>{e.preventDefault();const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;if(p1!==p2)return msg('Password tidak sama.');b.disabled=true;b.textContent='MENYIMPAN…';try{const {data:sessionData}=await window.VMSAuth.getSession();if(!sessionData?.session)throw new Error('Sesi reset tidak sah atau telah tamat. Sila minta reset link baharu.');const {error}=await window.VMSAuth.updatePassword(p1);if(error)throw error;msg('Password berjaya ditukar. Anda boleh log masuk semula.','success');setTimeout(()=>location.replace('/pages/login.html'),1000)}catch(err){console.error(err);msg(err?.message||'Gagal menukar password.')}finally{b.disabled=false;b.textContent='SIMPAN PASSWORD'}})})();
</script></body></html>
